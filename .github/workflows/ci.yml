name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin to the same Node line as production (Scalingo).
  NODE_VERSION: '26.9.0'

jobs:
  lint-typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile rules
        run: yarn rules:compile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile rules
        run: yarn rules:compile

      - name: Run unit tests
        run: yarn test:unit && yarn test:rules

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build application
        run: yarn build

      - name: Archive build output
        run: tar -czf /tmp/next-build.tgz .next

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: /tmp/next-build.tgz
          retention-days: 7

  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, build]
    strategy:
      fail-fast: false
      matrix:
        group:
          - ui
          - auth
          - organization
          - study
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: count
          MYSQL_PASSWORD: count
          MYSQL_DATABASE: count_test
        ports:
          # Match .env.test (local docker-compose db_test).
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u count -pcount"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start Maildev
        run: docker run -d --name maildev -p 1080:1080 -p 1025:1025 maildev/maildev:2.2.1

      - name: Migrate and seed test database
        run: yarn db:test:seed

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: /tmp/ci-build

      - name: Extract build artifact
        run: tar -xzf /tmp/ci-build/next-build.tgz -C .

      - name: Start test server
        run: yarn start:test &

      - name: Wait for test server
        run: yarn wait-on http://127.0.0.1:3001/login --timeout 60000

      - name: Run e2e tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn test:e2e:run --spec "src/tests/end-to-end/app/${{ matrix.group }}/**/*.cy.ts" --headless

      - name: Upload e2e screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: ${{ github.workspace }}/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: count
          MYSQL_PASSWORD: count
          MYSQL_DATABASE: count
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u count -pcount"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Migrate database
        run: yarn db migrate deploy

      - name: Seed database
        run: yarn db:seed

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: /tmp/ci-build

      - name: Extract build artifact
        run: tar -xzf /tmp/ci-build/next-build.tgz -C .

      - name: Start server
        run: yarn start &

      - name: Wait for server
        run: yarn wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Create Lighthouse output directory
        run: mkdir -p ${{ github.workspace }}/tmp/artifacts

      - name: Run Lighthouse
        id: lighthouse
        # Pin to release commit (v12.0.1); avoid floating @master.
        uses: foo-software/lighthouse-check-action@a80267da2e0244b8a2e457a8575fc47590615852
        with:
          device: all
          urls: http://localhost:3000/login
          outputDirectory: ${{ github.workspace }}/tmp/artifacts

      - name: Verify Lighthouse scores
        uses: foo-software/lighthouse-check-status-action@2b9d5101f7a0de86ddb153a0d77ad7046aac1052
        with:
          lighthouseCheckResults: ${{ steps.lighthouse.outputs.lighthouseCheckResults }}
          minAccessibilityScore: '100'
          minBestPracticesScore: '95'

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ github.workspace }}/tmp/artifacts
          retention-days: 7
          if-no-files-found: ignore
