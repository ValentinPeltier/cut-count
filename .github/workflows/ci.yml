name: CI

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  i18n-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check translation key parity and non-empty values
        run: node scripts/i18n/check-translations.mjs

  lint-typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile rules
        run: yarn rules:compile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile rules
        run: yarn rules:compile

      - name: Run unit tests
        run: yarn test:unit && yarn test:rules

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build application
        run: yarn build

      - name: Archive build output
        run: tar -czf /tmp/next-build.tgz .next

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: /tmp/next-build.tgz
          retention-days: 7

  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [i18n-check, lint-typecheck, unit-tests, build]
    strategy:
      fail-fast: false
      matrix:
        group:
          - ui
          - auth
          - organization
          - study
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: count
          MYSQL_PASSWORD: count
          MYSQL_DATABASE: count_test
        ports:
          # Match .env.test
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u count -pcount"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      maildev:
        image: maildev/maildev:2.2.1
        ports:
          - 1080:1080
          - 1025:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: /tmp/ci-build

      - name: Extract build artifact
        run: tar -xzf /tmp/ci-build/next-build.tgz -C .

      - name: Run e2e tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bash scripts/e2e-ci.sh --spec "src/tests/end-to-end/app/${{ matrix.group }}/**/*.cy.ts" --headless

      - name: Upload e2e screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: ${{ github.workspace }}/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [i18n-check, lint-typecheck, unit-tests, build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: count
          MYSQL_PASSWORD: count
          MYSQL_DATABASE: count
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u count -pcount"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Migrate database
        run: yarn db migrate deploy

      - name: Seed database
        run: yarn db:seed

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: /tmp/ci-build

      - name: Extract build artifact
        run: tar -xzf /tmp/ci-build/next-build.tgz -C .

      - name: Start server
        run: yarn start &

      - name: Wait for server
        run: yarn wait-on http://127.0.0.1:3000 --timeout 60000

      # Pin to release commit (12.6.2)
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          urls: |
            http://127.0.0.1:3000/login
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-reports
          runs: '1'
