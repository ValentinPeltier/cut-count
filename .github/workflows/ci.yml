name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master, develop]
permissions:
  contents: read
jobs:
  lint-and-typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: 'yarn'
      - name: Copy .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: Generate prisma files
        run: yarn db:generate
      - name: Linter
        run: yarn lint
      - name: Prebuild application
        run: yarn prebuild
      - name: TypeScript check
        run: yarn ts

  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: 'yarn'
      - name: Copy .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: Prebuild application
        run: yarn prebuild
      - name: Generate prisma files
        run: yarn db:generate
      - name: Launch unit tests
        run: yarn test

  build-app:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: 'yarn'
      - name: Copy .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: Prebuild application
        run: yarn prebuild
      - name: Generate prisma files
        run: yarn db:generate
      - name: Build application
        run: yarn build
      - name: Archive build output
        run: tar -czf /tmp/count-next-build.tgz .next
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-next-build
          path: /tmp/count-next-build.tgz

  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [build-app]
    strategy:
      fail-fast: false
      matrix:
        group:
          - count
          - auth
          - organization
          - study
          - emission-factors
          - emission-sources
          - pages
          - real-use-case
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bilancarbone
          POSTGRES_PASSWORD: bilancarbone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: 'yarn'
      - name: Run maildev
        run: docker run -d -p 1080:1080 -p 1025:1025 maildev/maildev
      - name: Copy .env
        run: cp .env.dist .env
      - name: Copy .env.test
        run: cp .env.dist .env.test
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: Prebuild application
        run: yarn prebuild
      - name: Generate prisma files
        run: yarn db:generate
      - name: Migrate DB
        run: yarn prisma migrate deploy
      - name: Seed DB
        run: yarn seed
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-next-build
          path: /tmp/ci-build
      - name: Extract build artifact
        run: tar -xzf /tmp/ci-build/count-next-build.tgz -C .
      - name: Start server
        run: yarn start &
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Launch e2e tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn cypress run --spec "src/tests/end-to-end/app/${{ matrix.group }}/**/*.cy.ts" --headless
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.group }}
          path: ${{ github.workspace }}/cypress/screenshots

  lighthouse:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [build-app]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bilancarbone
          POSTGRES_PASSWORD: bilancarbone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: 'yarn'
      - name: Run maildev
        run: docker run -d -p 1080:1080 -p 1025:1025 maildev/maildev
      - name: Copy .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: Prebuild application
        run: yarn prebuild
      - name: Generate prisma files
        run: yarn db:generate
      - name: Migrate DB
        run: yarn prisma migrate deploy
      - name: Seed DB
        run: yarn seed
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-next-build
          path: /tmp/ci-build
      - name: Extract build artifact
        run: tar -xzf /tmp/ci-build/count-next-build.tgz -C .
      - name: Start server
        run: yarn start &
      - run: mkdir -p ${{ github.workspace }}/tmp/artifacts
      - name: Lighthouse Check
        uses: foo-software/lighthouse-check-action@master
        id: lighthouseCheck
        with:
          device: all
          urls: 'http://localhost:3000'
          outputDirectory: ${{ github.workspace }}/tmp/artifacts
      - name: Verify Lighthouse Check results
        uses: foo-software/lighthouse-check-status-action@master
        with:
          lighthouseCheckResults: ${{ steps.lighthouseCheck.outputs.lighthouseCheckResults }}
          minAccessibilityScore: '100'
          # TODO : set back to 100 when all CSP error logs are fixed
          minBestPracticesScore: '90'
      - name: Upload Lighthouse artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lighthouse reports
          path: ${{ github.workspace }}/tmp/artifacts
