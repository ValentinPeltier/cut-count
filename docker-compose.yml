services:
  db:
    image: postgres:17
    container_name: bilancarbone-db
    environment:
      POSTGRES_USER: bilancarbone
      POSTGRES_PASSWORD: bilancarbone
      POSTGRES_DB: bilancarbone
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilancarbone -d bilancarbone']
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:17
    container_name: bilancarbone-db-test
    environment:
      POSTGRES_USER: bilancarbone
      POSTGRES_PASSWORD: bilancarbone
      POSTGRES_DB: bilancarbone_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilancarbone -d bilancarbone_test']
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: bilancarbone-maildev
    ports:
      - '1080:1080'
      - '1025:1025'
