services:
  db:
    image: postgres:17
    container_name: count-db
    environment:
      POSTGRES_USER: count
      POSTGRES_PASSWORD: count
      POSTGRES_DB: count
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U count -d count']
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:17
    container_name: count-db-test
    environment:
      POSTGRES_USER: count
      POSTGRES_PASSWORD: count
      POSTGRES_DB: count_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U count -d count_test']
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: count-maildev
    ports:
      - '1080:1080'
      - '1025:1025'
